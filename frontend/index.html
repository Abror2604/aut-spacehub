        <div class="h-5 w-px bg-neutral-300 shrink-0"></div>
        <div class="leading-tight min-w-0">
          <div class="font-extrabold text-sm text-aut-maroon tracking-tight truncate">SpaceHub</div>
          <div id="headerSub" class="text-[10px] text-neutral-500 truncate">AUT Beshyogoch &middot; Asia/Tashkent</div>
        </div>
      </div>
      <div class="flex items-center gap-1">
        <a id="adminLinkBtn" href="/admin" class="hidden px-2.5 py-1 rounded-lg bg-aut-ink text-white text-[10px] font-bold">Admin</a>
        <button id="notifBellBtn" type="button" class="relative p-2 rounded-full hover:bg-neutral-100 text-neutral-700" aria-label="Notifications">
          <i data-lucide="bell" class="w-4 h-4"></i>
          <span id="notifDot" class="hidden absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-aut-maroon"></span>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main id="screenRoot" class="flex-1 px-4 pt-4 safe-pb space-y-4">
      <div class="bg-white rounded-2xl border border-neutral-200 p-8 text-center text-xs text-neutral-500">Connecting to AUT SpaceHub...</div>
    </main>

    <!-- Mobile Bottom Navigation -->
    <nav id="bottomNav" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] bg-white border-t border-neutral-200 z-30 px-1 py-1.5 grid grid-cols-4" aria-label="Primary navigation"></nav>
  </div>

  <!-- Toast Stack -->
  <div id="toastStack" class="fixed top-14 left-1/2 -translate-x-1/2 w-full max-w-[440px] px-3 z-50 space-y-2 pointer-events-none"></div>

  <!-- Modal -->
  <div id="modalOverlay" class="hidden fixed inset-0 z-50 modal-bg flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div id="modalContent" class="bg-white w-full max-w-[480px] rounded-t-2xl sm:rounded-2xl max-h-[88vh] overflow-y-auto shadow-2xl border border-neutral-200"></div>
  </div>

  <script>
    // =========================================================================
    // LIVE TELEGRAM MINI APP CLIENT (100% CONNECTED TO FASTAPI + SQLITE)
    // =========================================================================
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    function getTashkentNow() {
      const now = new Date();
      const fmtDate = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tashkent', year: 'numeric', month: '2-digit', day: '2-digit' }).format(now);
      const fmtTime = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Tashkent', hour: '2-digit', minute: '2-digit', hour12: false }).format(now);
      return { date: fmtDate, time: fmtTime };
    }

    const initialClock = getTashkentNow();
    const appState = {
      me: null,
      notifications: [],
      tab: (window.location.hash || '').replace('#', '') || 'home',
      selectedDate: initialClock.date,
      selectedTime: initialClock.time,
      roomFilters: { availableNow: false, minDuration: 0, minCapacity: 0, floor: '', search: '' },
      rooms: [],
      sessions: [],
      sessionFilter: 'all',
      bookings: { upcoming: [], past: [], cancelled: [] },
      bookingTab: 'upcoming',
      clubDashboard: null
    };

    function authHeaders() {
      const headers = { 'Content-Type': 'application/json' };
      if (tg && tg.initData) {
        headers['X-Telegram-Init-Data'] = tg.initData;
      } else {
        // Browser fallback when opened outside Telegram for testing
        let browserId = '';
        try {
          browserId = localStorage.getItem('spacehub_browser_uid') || '';
          if (!browserId) {
            browserId = 'web_' + Math.floor(100000 + Math.random() * 900000);
            localStorage.setItem('spacehub_browser_uid', browserId);
          }
        } catch (e) { browserId = 'web_guest'; }
        headers['X-Demo-Telegram-Id'] = browserId;
      }
      return headers;
    }

    async function api(path, opts = {}) {
      const res = await fetch(path, {
        ...opts,
        headers: { ...authHeaders(), ...(opts.headers || {}) }
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || `Request failed (${res.status})`);
      return data;
    }

    function esc(v) {
      return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function toast(msg, tone = 'success') {
      const stack = document.getElementById('toastStack');
      const bg = tone === 'error' ? 'bg-red-800' : tone === 'info' ? 'bg-aut-maroon' : 'bg-aut-ink';
      const el = document.createElement('div');
      el.className = `pointer-events-auto ${bg} text-white text-xs font-semibold px-3.5 py-2.5 rounded-xl shadow-lg flex items-center justify-between gap-2`;
      el.innerHTML = `<span>${esc(msg)}</span><button type="button" class="opacity-70" onclick="this.parentElement.remove()">✕</button>`;
      stack.appendChild(el);
      setTimeout(() => { if (el.parentElement) el.remove(); }, 4000);
    }
    function openModal(html) {
      document.getElementById('modalContent').innerHTML = html;
      document.getElementById('modalOverlay').classList.remove('hidden');
      if (window.lucide) lucide.createIcons();
    }
    function closeModal() {
      document.getElementById('modalOverlay').classList.add('hidden');
      document.getElementById('modalContent').innerHTML = '';
    }
    document.getElementById('modalOverlay').addEventListener('click', (e) => { if (e.target.id === 'modalOverlay') closeModal(); });

    async function refreshAll() {
      try {
        const meData = await api('/api/me');
        appState.me = meData.user;
        appState.notifications = meData.notifications || [];
        document.getElementById('notifDot').classList.toggle('hidden', appState.notifications.length === 0);
        document.getElementById('adminLinkBtn').classList.toggle('hidden', !appState.me.is_admin);

        const q = new URLSearchParams({
          date: appState.selectedDate,
          time: appState.selectedTime,
          available_now: String(appState.roomFilters.availableNow),
          min_duration_minutes: String(appState.roomFilters.minDuration),
          min_capacity: String(appState.roomFilters.minCapacity)
        });
        if (appState.roomFilters.floor) q.set('floor', appState.roomFilters.floor);

        const [roomsRes, sessRes, bkRes] = await Promise.all([
          api('/api/rooms?' + q.toString()),
          api('/api/sessions'),
          api('/api/my-bookings')
        ]);
        appState.rooms = roomsRes.rooms || [];
        appState.sessions = sessRes.sessions || [];
        appState.bookings = bkRes;

        if (appState.me.is_approved_club_leader) {
          appState.clubDashboard = await api('/api/club/dashboard');
        }
        render();
      } catch (err) {
        document.getElementById('screenRoot').innerHTML = `
          <div class="bg-white rounded-2xl border border-red-200 p-6 text-center space-y-2">
            <div class="font-bold text-sm text-red-800">Could not connect to SpaceHub Server</div>
            <div class="text-xs text-neutral-600">${esc(err.message)}</div>
            <button type="button" onclick="refreshAll()" class="mt-2 px-4 py-2 rounded-xl bg-aut-maroon text-white text-xs font-bold">Retry</button>
          </div>`;
      }
    }

    function switchTab(tab) {
      appState.tab = tab;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderBottomNav() {
      const nav = document.getElementById('bottomNav');
      const items = [
        { id: 'home', label: 'Home', icon: 'home' },
        { id: 'rooms', label: 'Rooms', icon: 'door-open' },
        { id: 'sessions', label: 'Sessions', icon: 'users' },
        { id: 'bookings', label: 'My Bookings', icon: 'calendar-check' }
      ];
      if (appState.me && appState.me.is_approved_club_leader) {
        items.push({ id: 'club', label: 'Club Portal', icon: 'sparkles' });
      }
      nav.className = `fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] bg-white border-t border-neutral-200 z-30 px-1 py-1.5 grid ${items.length === 5 ? 'grid-cols-5' : 'grid-cols-4'}`;
      nav.innerHTML = items.map(it => `
        <button type="button" data-tab="${it.id}" class="bottom-nav-btn flex flex-col items-center justify-center py-1 text-[10px] ${appState.tab === it.id ? 'active text-aut-maroon' : 'text-neutral-500'}">
          <i data-lucide="${it.icon}" class="w-4 h-4 mb-0.5"></i>
          <span>${it.label}</span>
        </button>
      `).join('');
      nav.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));
    }

    function render() {
      if (!appState.me) return;
      document.getElementById('headerSub').textContent = `${appState.selectedDate} · ${appState.selectedTime} (Asia/Tashkent)`;
      renderBottomNav();
      const root = document.getElementById('screenRoot');
      if (appState.tab === 'home') root.innerHTML = renderHome();
      else if (appState.tab === 'rooms') root.innerHTML = renderRooms();
      else if (appState.tab === 'sessions') root.innerHTML = renderSessions();
      else if (appState.tab === 'bookings') root.innerHTML = renderBookings();
      else if (appState.tab === 'club') root.innerHTML = renderClubPortal();
      bindEvents();
      if (window.lucide) lucide.createIcons();
    }

    function renderHome() {
      const firstName = (appState.me.full_name || 'Student').split(' ')[0];
      const freeNow = appState.rooms.filter(r => r.status === 'available' || r.status === 'closing_soon');
      const free2h = freeNow.filter(r => r.remaining_minutes >= 120);
      const nextBk = appState.bookings.upcoming[0] || null;

      return `
        <div class="space-y-4">
          <div class="bg-white rounded-2xl border border-neutral-200 p-4 shadow-sm">
            <div class="text-[11px] font-semibold text-aut-maroon uppercase tracking-wider">AUT Beshyogoch Campus</div>
            <h1 class="text-xl font-extrabold text-aut-ink mt-1">Hi, ${esc(firstName)}</h1>
            <p class="text-xs text-neutral-600 mt-1">Where would you like to study or organize an activity?</p>
            <div class="grid grid-cols-2 gap-2.5 mt-4">
              <button type="button" data-go="rooms" class="py-3 px-3 rounded-xl bg-aut-maroon hover:bg-aut-maroonDark text-white font-bold text-xs flex items-center justify-center gap-1.5">
                <i data-lucide="door-open" class="w-4 h-4"></i> Find a Room
              </button>
              <button type="button" data-go="sessions" class="py-3 px-3 rounded-xl bg-aut-ink hover:bg-neutral-800 text-white font-bold text-xs flex items-center justify-center gap-1.5">
                <i data-lucide="users" class="w-4 h-4"></i> Explore Sessions
              </button>
            </div>
          </div>

          <div class="bg-white rounded-2xl border border-neutral-200 p-4 shadow-sm">
            <div class="flex items-center justify-between mb-2.5">
              <span class="text-xs font-extrabold text-aut-ink">Available Now (${esc(appState.selectedTime)})</span>
              <span class="text-[11px] font-semibold text-emerald-700">${freeNow.length} free &middot; ${free2h.length} for 2h+</span>
            </div>
            ${freeNow.length === 0 ? `
              <p class="text-xs text-neutral-500">Campus study hours are 08:00–21:00. Open <strong>Rooms</strong> to check tomorrow's schedule.</p>
            ` : `
              <div class="space-y-2">
                ${freeNow.slice(0, 3).map(r => `
                  <button type="button" data-room-open="${r.room_id}" class="w-full text-left p-3 rounded-xl bg-neutral-50 hover:bg-aut-maroonLight border border-neutral-200 flex items-center justify-between">
                    <div>
                      <div class="font-bold text-xs text-aut-ink">${esc(r.name)} <span class="font-normal text-neutral-500">&middot; Fl ${r.floor}</span></div>
                      <div class="text-[11px] text-emerald-800 font-semibold mt-0.5">Free until ${esc(r.free_until)} (${esc(r.remaining_text)})</div>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-neutral-400"></i>
                  </button>
                `).join('')}
              </div>
            `}
          </div>

          ${nextBk ? `
            <div class="bg-white rounded-2xl border-l-4 border-l-aut-maroon border border-neutral-200 p-4 shadow-sm">
              <div class="flex items-center justify-between">
                <span class="text-[11px] font-bold uppercase text-aut-maroon">Your Next Booking</span>
                <button type="button" data-go="bookings" class="text-[11px] font-semibold text-neutral-500">View all &rarr;</button>
              </div>
              <div class="font-bold text-sm text-aut-ink mt-1">${esc(nextBk.title)}</div>
              <div class="text-xs text-neutral-600 mt-0.5">${esc(nextBk.room_name)} &middot; ${esc(nextBk.date)} &middot; ${esc(nextBk.start_time)}–${esc(nextBk.end_time)}</div>
            </div>
          ` : ''}

          ${appState.me.is_approved_club_leader ? `
            <div class="bg-aut-maroonLight border border-aut-maroonBorder rounded-2xl p-4 flex items-center justify-between gap-3">
              <div>
                <div class="text-[10px] font-extrabold uppercase text-aut-maroon">Approved Club Leader</div>
                <div class="font-bold text-sm text-aut-ink mt-0.5">${esc(appState.me.approved_clubs[0]?.name || 'Club Portal')}</div>
              </div>
              <button type="button" data-go="club" class="px-3.5 py-2 rounded-xl bg-aut-maroon text-white text-xs font-bold shrink-0">Club Portal</button>
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderRooms() {
      const f = appState.roomFilters;
      const shown = appState.rooms.filter(r => !f.search || `${r.name} ${r.room_type} floor ${r.floor}`.toLowerCase().includes(f.search.toLowerCase()));
      return `
        <div class="space-y-3.5">
          <div class="flex items-center justify-between">
            <h1 class="text-lg font-extrabold text-aut-ink">Study Rooms</h1>
            <span class="text-[11px] font-semibold text-neutral-500">${shown.length} rooms</span>
          </div>

          <div class="bg-white rounded-2xl border border-neutral-200 p-3.5 space-y-2.5 shadow-sm">
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[10px] font-bold text-neutral-500 uppercase mb-1">Date</label>
                <input id="rmDate" type="date" value="${esc(appState.selectedDate)}" class="w-full px-2.5 py-1.5 text-xs border border-neutral-300 rounded-lg" />
              </div>
              <div>
                <label class="block text-[10px] font-bold text-neutral-500 uppercase mb-1">Time (Tashkent)</label>
                <input id="rmTime" type="time" value="${esc(appState.selectedTime)}" class="w-full px-2.5 py-1.5 text-xs border border-neutral-300 rounded-lg" />
              </div>
            </div>
            <input id="rmSearch" type="text" value="${esc(f.search)}" placeholder="Search room number or type..." class="w-full px-3 py-2 text-xs border border-neutral-300 rounded-lg" />
            <div class="flex flex-wrap gap-1.5">
              <button type="button" id="fltAvailNow" class="px-2.5 py-1 rounded-full text-[11px] font-semibold border ${f.availableNow ? 'bg-aut-maroon text-white border-aut-maroon' : 'bg-neutral-50 text-neutral-700 border-neutral-300'}">Available Now</button>
              <button type="button" id="flt2h" class="px-2.5 py-1 rounded-full text-[11px] font-semibold border ${f.minDuration === 120 ? 'bg-aut-maroon text-white border-aut-maroon' : 'bg-neutral-50 text-neutral-700 border-neutral-300'}">2+ Hours Free</button>
              <select id="fltFloor" class="px-2.5 py-1 rounded-full text-[11px] font-semibold border border-neutral-300 bg-neutral-50">
                <option value="" ${!f.floor ? 'selected' : ''}>All Floors</option>
                ${[2,3,4,5,6].map(fl => `<option value="${fl}" ${String(f.floor) === String(fl) ? 'selected' : ''}>Floor ${fl}</option>`).join('')}
              </select>
            </div>
          </div>

          <div class="space-y-3">
            ${shown.length === 0 ? `<div class="bg-white rounded-2xl border border-neutral-200 p-8 text-center text-xs text-neutral-500">No rooms match your filter for ${esc(appState.selectedDate)} at ${esc(appState.selectedTime)}.</div>` : shown.map(r => {
              const isAvail = r.status === 'available' || r.status === 'closing_soon';
              const badge = r.status === 'unavailable' || r.status === 'closed'
                ? 'bg-neutral-200 text-neutral-700'
                : r.status === 'occupied'
                  ? 'bg-aut-ink text-white'
                  : r.status === 'closing_soon'
                    ? 'bg-amber-100 text-amber-900 border border-amber-300'
                    : 'bg-emerald-100 text-emerald-900 border border-emerald-300';
              return `
                <article class="bg-white rounded-2xl border border-neutral-200 p-4 shadow-sm space-y-2.5">
                  <div class="flex items-start justify-between gap-2">
                    <div>
                      <h2 class="font-extrabold text-sm text-aut-ink">${esc(r.name)}</h2>
                      <div class="text-[11px] text-neutral-500">${esc(r.building)} &middot; Floor ${r.floor} &middot; ${r.capacity} seats</div>
                    </div>
                    <span class="px-2 py-0.5 rounded-full text-[10px] font-bold shrink-0 ${badge}">${esc(r.status_label)}</span>
                  </div>
                  ${isAvail ? `
                    <div class="p-2.5 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-950 text-xs">
                      <div>Free until: <strong>${esc(r.free_until)}</strong></div>
                      <div>Remaining available time: <strong>${esc(r.remaining_text)}</strong></div>
                    </div>
                  ` : r.status === 'occupied' ? `
                    <div class="p-2.5 rounded-xl bg-red-50 border border-red-200 text-red-950 text-xs">
                      <div>Expected to become available: <strong>${esc(r.next_available_start || 'Tomorrow 08:00')}</strong></div>
                      <div>Next available window: <strong>${esc(r.next_available_window || 'None remaining today')}</strong></div>
                    </div>
                  ` : `
                    <div class="p-2.5 rounded-xl bg-neutral-100 text-neutral-600 text-xs">${r.status === 'closed' ? 'Campus booking hours are 08:00–21:00. Change date/time above to inspect tomorrow.' : 'Unavailable for student booking.'}</div>
                  `}
                  <div class="flex gap-2">
                    <button type="button" data-room-open="${r.room_id}" class="flex-1 py-2 rounded-xl border border-neutral-300 text-xs font-bold text-aut-ink">Timetable</button>
                    ${r.student_bookable && r.status !== 'unavailable' ? `<button type="button" data-room-book="${r.room_id}" class="flex-1 py-2 rounded-xl bg-aut-maroon text-white text-xs font-bold">Reserve</button>` : ''}
                  </div>
                </article>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function openRoomDetail(roomId) {
      const r = appState.rooms.find(x => x.room_id === roomId);
      if (!r) return;
      openModal(`
        <div class="p-5 space-y-4">
          <div class="flex items-start justify-between">
            <div>
              <div class="text-[11px] font-bold text-aut-maroon uppercase">${esc(r.date)}</div>
              <h2 class="text-lg font-extrabold text-aut-ink">${esc(r.name)} &middot; Floor ${r.floor}</h2>
              <p class="text-xs text-neutral-500">${esc(r.room_type)} &middot; ${r.capacity} seats</p>
            </div>
            <button type="button" onclick="closeModal()" class="p-1.5 rounded-lg hover:bg-neutral-100"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>
          <div>
            <h3 class="text-xs font-extrabold uppercase text-emerald-800 mb-1.5">Available Windows</h3>
            <div class="flex flex-wrap gap-1.5">
              ${(r.free_windows || []).map(w => `<span class="px-2.5 py-1 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-900 text-xs font-semibold">${w.start}–${w.end} (${esc(w.duration_text)})</span>`).join('') || '<span class="text-xs text-neutral-500">None</span>'}
            </div>
          </div>
          <div>
            <h3 class="text-xs font-extrabold uppercase text-neutral-500 mb-1.5">Scheduled Classes &amp; Bookings</h3>
            <div class="space-y-1.5">
              ${(r.events || []).map(ev => `<div class="p-2.5 rounded-xl bg-neutral-50 border border-neutral-200 flex justify-between text-xs"><span class="font-bold">${esc(ev.title)}</span><span class="font-mono text-neutral-600">${ev.start}–${ev.end}</span></div>`).join('') || '<p class="text-xs text-neutral-500">No scheduled events.</p>'}
            </div>
          </div>
          ${r.student_bookable && r.status !== 'unavailable' ? `<button type="button" id="mResBtn" class="w-full py-2.5 rounded-xl bg-aut-maroon text-white text-xs font-bold">Reserve This Room</button>` : ''}
        </div>
      `);
      const b = document.getElementById('mResBtn');
      if (b) b.addEventListener('click', () => openReserveModal(roomId));
    }

    function openReserveModal(roomId) {
      const r = appState.rooms.find(x => x.room_id === roomId);
      if (!r) return;
      const firstWin = (r.free_windows || [])[0];
      const defStart = r.next_available_start || (firstWin ? firstWin.start : '10:00');
      const defEnd = firstWin && defStart === firstWin.start ? firstWin.end.slice(0, 5) : '12:00';
      openModal(`
        <form id="resForm" class="p-5 space-y-3.5 text-xs">
          <div class="flex items-start justify-between">
            <div><span class="text-[10px] font-bold uppercase text-aut-maroon">Reserve Room</span><h2 class="text-lg font-extrabold">${esc(r.name)} (${esc(appState.selectedDate)})</h2></div>
            <button type="button" onclick="closeModal()" class="p-1.5 rounded-lg hover:bg-neutral-100"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>
          <div id="resErr" class="hidden p-2.5 rounded-xl bg-red-50 border border-red-300 text-red-900 font-semibold"></div>
          <div class="grid grid-cols-2 gap-2">
            <div><label class="block font-bold mb-1">Start</label><input id="fStart" type="time" value="${defStart}" required class="w-full px-3 py-2 border border-neutral-300 rounded-xl" /></div>
            <div><label class="block font-bold mb-1">End</label><input id="fEnd" type="time" value="${defEnd}" required class="w-full px-3 py-2 border border-neutral-300 rounded-xl" /></div>
          </div>
          <div><label class="block font-bold mb-1">Purpose</label><input id="fPurpose" type="text" value="Study Session" required class="w-full px-3 py-2 border border-neutral-300 rounded-xl" /></div>
          <button type="submit" class="w-full py-2.5 rounded-xl bg-aut-maroon text-white font-bold">Confirm Reservation</button>
        </form>
      `);
      document.getElementById('resForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const err = document.getElementById('resErr');
        try {
          const out = await api('/api/reservations', {
            method: 'POST',
            body: JSON.stringify({
              room_id: roomId,
              reservation_date: appState.selectedDate,
              start_time: document.getElementById('fStart').value,
              end_time: document.getElementById('fEnd').value,
              purpose: document.getElementById('fPurpose').value.trim()
            })
          });
          closeModal();
          toast(`Confirmed! Code: ${out.booking_code}`);
          await refreshAll();
        } catch (ex) {
          err.textContent = ex.message;
          err.classList.remove('hidden');
        }
      });
    }

    function renderSessions() {
      const list = appState.sessions.filter(s => appState.sessionFilter === 'all' || s.session_type === appState.sessionFilter);
      return `
        <div class="space-y-3.5">
          <h1 class="text-lg font-extrabold text-aut-ink">Study Sessions &amp; Club Events</h1>
          <div class="flex flex-wrap gap-1.5">
            ${[['all', 'All'], ['quiet', 'Quiet Study'], ['collaboration', 'Collaboration'], ['club_event', 'Club Events']].map(([k, l]) => `
              <button type="button" data-sf="${k}" class="px-3 py-1.5 rounded-full text-xs font-semibold border ${appState.sessionFilter === k ? 'bg-aut-maroon text-white border-aut-maroon' : 'bg-white text-neutral-700 border-neutral-300'}">${l}</button>
            `).join('')}
          </div>
          <div class="space-y-3">
            ${list.length === 0 ? '<div class="bg-white rounded-2xl border border-neutral-200 p-8 text-center text-xs text-neutral-500">No sessions in this category yet.</div>' : list.map(s => {
              const tagStyle = s.session_type === 'quiet' ? 'bg-aut-quietBg text-aut-quiet' : s.session_type === 'club_event' ? 'bg-amber-100 text-amber-900' : 'bg-aut-maroonLight text-aut-maroon';
              const tagLabel = s.session_type === 'quiet' ? 'Quiet Study' : s.session_type === 'club_event' ? 'Club Event' : `Collaboration (Min ${s.min_group_size})`;
              return `
                <article class="bg-white rounded-2xl border border-neutral-200 p-4 shadow-sm space-y-2.5">
                  <div class="flex items-center justify-between">
                    <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold ${tagStyle}">${tagLabel}</span>
                    <span class="text-[11px] font-bold ${s.is_full ? 'text-red-700' : 'text-emerald-700'}">${s.is_full ? 'Full' : `${s.seats_available}/${s.max_capacity} seats left`}</span>
                  </div>
                  <div>
                    <h2 class="font-extrabold text-sm text-aut-ink">${esc(s.title)}</h2>
                    <p class="text-xs text-neutral-600 mt-0.5">${esc(s.description)}</p>
                  </div>
                  <div class="text-xs text-neutral-600"><strong>${esc(s.room_name)}</strong> &middot; ${esc(s.session_date)} ${esc(s.start_time)}–${esc(s.end_time)}</div>
                  ${s.user_registered ? `
                    <button type="button" data-leave-s="${s.id}" class="w-full py-2 rounded-xl border border-red-300 bg-red-50 text-red-800 text-xs font-bold">Leave Session (Joined)</button>
                  ` : s.is_full ? `
                    <button type="button" disabled class="w-full py-2 rounded-xl bg-neutral-200 text-neutral-500 text-xs font-bold">Session Full</button>
                  ` : `
                    <button type="button" data-join-s="${s.id}" class="w-full py-2 rounded-xl bg-aut-maroon text-white text-xs font-bold">${s.session_type === 'collaboration' ? `Register Group (Min ${s.min_group_size})` : 'Join Session'}</button>
                  `}
                </article>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderBookings() {
      const list = appState.bookings[appState.bookingTab] || [];
      return `
        <div class="space-y-3.5">
          <h1 class="text-lg font-extrabold text-aut-ink">My Bookings</h1>
          <div class="grid grid-cols-3 gap-1.5 bg-white p-1 rounded-xl border border-neutral-200">
            ${[['upcoming', 'Upcoming'], ['past', 'Past'], ['cancelled', 'Cancelled']].map(([k, l]) => `
              <button type="button" data-bt="${k}" class="py-1.5 rounded-lg text-xs font-bold ${appState.bookingTab === k ? 'bg-aut-maroon text-white' : 'text-neutral-600'}">${l}</button>
            `).join('')}
          </div>
          ${list.length === 0 ? `<div class="bg-white rounded-2xl border border-neutral-200 p-8 text-center text-xs text-neutral-500">No ${appState.bookingTab} bookings yet.</div>` : `
            <div class="space-y-2.5">
              ${list.map(b => `
                <div class="bg-white rounded-2xl border border-neutral-200 p-4 shadow-sm space-y-2">
                  <div class="flex justify-between items-center">
                    <span class="text-[10px] font-mono font-bold text-neutral-500">${esc(b.code)}</span>
                    <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800">${esc(b.status.replace('_', ' '))}</span>
                  </div>
                  <div class="font-bold text-sm text-aut-ink">${esc(b.title)}</div>
                  <div class="text-xs text-neutral-600">${esc(b.room_name)} &middot; ${esc(b.date)} &middot; ${esc(b.start_time)}–${esc(b.end_time)}</div>
                  ${appState.bookingTab === 'upcoming' ? `
                    <button type="button" data-cancel-bk="${b.kind}:${b.id}" class="w-full py-2 rounded-xl border border-red-300 bg-red-50 text-red-800 text-xs font-bold">Cancel Booking</button>
                  ` : ''}
                </div>
              `).join('')}
            </div>
          `}
        </div>
      `;
    }

    function renderClubPortal() {
      const dash = appState.clubDashboard || { clubs: [], events: [] };
      const club = dash.clubs[0];
      return `
        <div class="space-y-4">
          <div class="bg-aut-ink text-white rounded-2xl p-4 space-y-3">
            <div>
              <span class="text-[10px] font-bold uppercase text-amber-300">Approved Club Portal</span>
              <h1 class="text-lg font-extrabold mt-0.5">${esc(club ? club.name : 'AUT Club')}</h1>
            </div>
            <button type="button" id="openClubEvBtn" class="w-full py-2.5 rounded-xl bg-aut-maroon text-white text-xs font-bold">+ Create New Club Event</button>
          </div>
          <div class="space-y-2.5">
            ${dash.events.length === 0 ? '<div class="bg-white rounded-2xl border border-neutral-200 p-6 text-center text-xs text-neutral-500">No club events yet. Tap Create New Club Event above.</div>' : dash.events.map(ev => `
              <article class="bg-white rounded-2xl border border-neutral-200 p-4 shadow-sm space-y-2">
                <div class="flex justify-between text-[10px] font-bold">
                  <span class="px-2 py-0.5 rounded-full bg-amber-100 text-amber-900">${esc(ev.status.replace('_', ' ').toUpperCase())}</span>
                  <span class="text-neutral-500">${ev.is_published ? 'Published' : 'Draft'}</span>
                </div>
                <div class="font-extrabold text-sm">${esc(ev.title)}</div>
                <div class="text-xs text-neutral-600">${esc(ev.room_name)} &middot; ${esc(ev.event_date)} ${esc(ev.start_time)}–${esc(ev.end_time)}</div>
                <div class="flex gap-2">
                  ${ev.status === 'confirmed' && !ev.is_published ? `<button type="button" data-pub-ev="${ev.id}" class="flex-1 py-2 rounded-xl bg-aut-maroon text-white text-xs font-bold">Publish to Sessions</button>` : ''}
                  ${ev.status !== 'cancelled' ? `<button type="button" data-can-ev="${ev.id}" class="flex-1 py-2 rounded-xl border border-red-300 bg-red-50 text-red-800 text-xs font-bold">Cancel</button>` : ''}
                </div>
              </article>
            `).join('')}
          </div>
        </div>
      `;
    }

    function openCreateClubModal() {
      const club = appState.me.approved_clubs[0];
      openModal(`
        <form id="ceForm" class="p-5 space-y-3 text-xs">
          <div class="flex justify-between items-center"><h2 class="text-base font-extrabold">Create Club Event</h2><button type="button" onclick="closeModal()"><i data-lucide="x" class="w-5 h-5"></i></button></div>
          <div id="ceErr" class="hidden p-2.5 rounded-xl bg-red-50 border border-red-300 text-red-900 font-semibold"></div>
          <input id="ceTitle" type="text" required placeholder="Event Title" class="w-full px-3 py-2 border border-neutral-300 rounded-xl" />
          <input id="ceDesc" type="text" required placeholder="Short Description" class="w-full px-3 py-2 border border-neutral-300 rounded-xl" />
          <div class="grid grid-cols-3 gap-2">
            <input id="ceDate" type="date" value="${appState.selectedDate}" required class="px-2 py-2 border border-neutral-300 rounded-xl" />
            <input id="ceStart" type="time" value="18:00" required class="px-2 py-2 border border-neutral-300 rounded-xl" />
            <input id="ceEnd" type="time" value="20:00" required class="px-2 py-2 border border-neutral-300 rounded-xl" />
          </div>
          <div class="grid grid-cols-2 gap-2">
            <input id="ceExp" type="number" value="20" min="3" max="100" required class="px-3 py-2 border border-neutral-300 rounded-xl" />
            <select id="ceRoom" class="px-2 py-2 border border-neutral-300 rounded-xl bg-white">
              <option value="404">Room 404 (Club-Only · 30 seats)</option>
              <option value="501">Room 501 (Club-Only · 40 seats)</option>
              <option value="302">Room 302 (Shared · 24 seats)</option>
              <option value="601">Room 601 (Shared · 45 seats)</option>
            </select>
          </div>
          <button type="submit" class="w-full py-2.5 rounded-xl bg-aut-maroon text-white font-bold">Submit Club Event</button>
        </form>
      `);
      document.getElementById('ceForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const err = document.getElementById('ceErr');
        try {
          const out = await api('/api/club/events', {
            method: 'POST',
            body: JSON.stringify({
              club_id: club.id,
              title: document.getElementById('ceTitle').value.trim(),
              description: document.getElementById('ceDesc').value.trim(),
              category: 'Workshop',
              event_date: document.getElementById('ceDate').value,
              start_time: document.getElementById('ceStart').value,
              end_time: document.getElementById('ceEnd').value,
              room_id: document.getElementById('ceRoom').value,
              expected_participants: parseInt(document.getElementById('ceExp').value, 10),
              is_open_to_all: true
            })
          });
          closeModal();
          toast(`Club event created (${out.status.replace('_', ' ')})!`);
          await refreshAll();
        } catch (ex) {
          err.textContent = ex.message;
          err.classList.remove('hidden');
        }
      });
    }

    function bindEvents() {
      document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.go)));
      document.querySelectorAll('[data-room-open]').forEach(b => b.addEventListener('click', () => openRoomDetail(b.dataset.roomOpen)));
      document.querySelectorAll('[data-room-book]').forEach(b => b.addEventListener('click', () => openReserveModal(b.dataset.roomBook)));

      const rmDate = document.getElementById('rmDate');
      if (rmDate) rmDate.addEventListener('change', (e) => { appState.selectedDate = e.target.value; refreshAll(); });
      const rmTime = document.getElementById('rmTime');
      if (rmTime) rmTime.addEventListener('change', (e) => { appState.selectedTime = e.target.value; refreshAll(); });
      const rmSearch = document.getElementById('rmSearch');
      if (rmSearch) rmSearch.addEventListener('input', (e) => { appState.roomFilters.search = e.target.value; render(); });
      const fltAvailNow = document.getElementById('fltAvailNow');
      if (fltAvailNow) fltAvailNow.addEventListener('click', () => { appState.roomFilters.availableNow = !appState.roomFilters.availableNow; refreshAll(); });
      const flt2h = document.getElementById('flt2h');
      if (flt2h) flt2h.addEventListener('click', () => { appState.roomFilters.minDuration = appState.roomFilters.minDuration === 120 ? 0 : 120; refreshAll(); });
      const fltFloor = document.getElementById('fltFloor');
      if (fltFloor) fltFloor.addEventListener('change', (e) => { appState.roomFilters.floor = e.target.value; refreshAll(); });

      document.querySelectorAll('[data-sf]').forEach(b => b.addEventListener('click', () => { appState.sessionFilter = b.dataset.sf; render(); }));
      document.querySelectorAll('[data-join-s]').forEach(b => b.addEventListener('click', async () => {
        const sid = parseInt(b.dataset.joinS, 10);
        const s = appState.sessions.find(x => x.id === sid);
        if (s && s.session_type === 'collaboration') {
          openModal(`
            <form id="gForm" class="p-5 space-y-3 text-xs">
              <h2 class="font-extrabold text-base">Register Group (Min ${s.min_group_size})</h2>
              <input id="gSize" type="number" value="${s.min_group_size}" min="${s.min_group_size}" max="10" required class="w-full px-3 py-2 border border-neutral-300 rounded-xl" />
              <button type="submit" class="w-full py-2.5 rounded-xl bg-aut-maroon text-white font-bold">Confirm Group</button>
            </form>
          `);
          document.getElementById('gForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
              await api(`/api/sessions/${sid}/join`, { method: 'POST', body: JSON.stringify({ group_size: parseInt(document.getElementById('gSize').value, 10) }) });
              closeModal(); toast('Group registered!'); await refreshAll();
            } catch (ex) { toast(ex.message, 'error'); }
          });
        } else {
          try {
            await api(`/api/sessions/${sid}/join`, { method: 'POST', body: JSON.stringify({ group_size: 1 }) });
            toast('Joined session!'); await refreshAll();
          } catch (ex) { toast(ex.message, 'error'); }
        }
      }));

      document.querySelectorAll('[data-leave-s]').forEach(b => b.addEventListener('click', async () => {
        try { await api(`/api/sessions/${b.dataset.leaveS}/leave`, { method: 'POST' }); toast('Left session.', 'info'); await refreshAll(); }
        catch (ex) { toast(ex.message, 'error'); }
      }));

      document.querySelectorAll('[data-bt]').forEach(b => b.addEventListener('click', () => { appState.bookingTab = b.dataset.bt; render(); }));
      document.querySelectorAll('[data-cancel-bk]').forEach(b => b.addEventListener('click', async () => {
        const [kind, id] = b.dataset.cancelBk.split(':');
        try {
          if (kind === 'room_reservation') await api(`/api/reservations/${id}/cancel`, { method: 'POST' });
          else await api(`/api/sessions/${id}/leave`, { method: 'POST' });
          toast('Booking cancelled.', 'info'); await refreshAll();
        } catch (ex) { toast(ex.message, 'error'); }
      }));

      const ceBtn = document.getElementById('openClubEvBtn');
      if (ceBtn) ceBtn.addEventListener('click', openCreateClubModal);
      document.querySelectorAll('[data-pub-ev]').forEach(b => b.addEventListener('click', async () => {
        try { await api(`/api/club/events/${b.dataset.pubEv}/publish`, { method: 'POST' }); toast('Published to Sessions!'); await refreshAll(); }
        catch (ex) { toast(ex.message, 'error'); }
      }));
      document.querySelectorAll('[data-can-ev]').forEach(b => b.addEventListener('click', async () => {
        try { await api(`/api/club/events/${b.dataset.canEv}/cancel`, { method: 'POST' }); toast('Club event cancelled.', 'info'); await refreshAll(); }
        catch (ex) { toast(ex.message, 'error'); }
      }));
    }

    document.getElementById('notifBellBtn').addEventListener('click', () => {
      openModal(`
        <div class="p-5 space-y-3">
          <div class="flex justify-between items-center"><h2 class="font-extrabold text-base">Notifications</h2><button type="button" onclick="closeModal()"><i data-lucide="x" class="w-5 h-5"></i></button></div>
          ${appState.notifications.length === 0 ? '<p class="text-xs text-neutral-500">No notifications yet.</p>' : appState.notifications.map(n => `
            <div class="p-3 rounded-xl bg-neutral-50 border border-neutral-200 text-xs">
              <div class="font-bold">${esc(n.title)}</div>
              <div class="text-neutral-600 mt-0.5">${esc(n.message)}</div>
            </div>
          `).join('')}
        </div>
      `);
    });

    refreshAll();
  </script>
</body>
</html>
