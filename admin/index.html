<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AUT SpaceHub — Administrator Panel</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>
<body class="bg-neutral-100 text-neutral-900 min-h-screen p-4 sm:p-8 font-sans">
  <div class="max-w-5xl mx-auto space-y-6">
    <header class="bg-[#22201F] text-white rounded-2xl p-6 flex flex-wrap items-center justify-between gap-4">
      <div>
        <div class="text-xs uppercase tracking-wider text-amber-300 font-bold">AUT SpaceHub &middot; Backend Administration</div>
        <h1 class="text-2xl font-extrabold mt-1">Separate Administrator Panel</h1>
        <p class="text-xs text-neutral-300 mt-1">Connected directly to FastAPI (/api/admin/*) with server-side RBAC enforcement.</p>
      </div>
      <button id="refreshBtn" class="px-4 py-2 rounded-xl bg-[#80003C] hover:bg-[#61002D] text-xs font-bold">Refresh Data</button>
    </header>
    <div id="adminRoot" class="bg-white rounded-2xl border border-neutral-200 p-6 text-sm text-neutral-600">Loading administrator data...</div>
  </div>
  <script>
    const headers = { 'Content-Type': 'application/json', 'X-Demo-Telegram-Id': '100003' };
    async function load() {
      const root = document.getElementById('adminRoot');
      try {
        const res = await fetch('/api/admin/overview', { headers });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        root.innerHTML = `
          <div class="grid md:grid-cols-2 gap-6">
            <div>
              <h2 class="font-bold text-base mb-3">Rooms &amp; Access Permissions (${data.rooms.length})</h2>
              <div class="space-y-2">${data.rooms.map(r => `<div class="p-2.5 rounded-lg border flex justify-between text-xs"><strong>${r.name} (${r.capacity})</strong><span class="font-mono text-[#80003C]">${r.access_mode}</span></div>`).join('')}</div>
            </div>
            <div>
              <h2 class="font-bold text-base mb-3">Club Events (${data.club_events.length})</h2>
              <div class="space-y-2">${data.club_events.map(e => `<div class="p-2.5 rounded-lg border text-xs"><div class="font-bold">${e.title}</div><div>Room ${e.room_id} · ${e.event_date} ${e.start_time}–${e.end_time} · <strong>${e.status}</strong></div></div>`).join('')}</div>
              <h2 class="font-bold text-base mt-6 mb-3">Recent Audit Log (${data.audit_log.length})</h2>
              <div class="space-y-1.5 text-xs">${data.audit_log.slice(0, 8).map(a => `<div class="text-neutral-600">${a.created_at} — <strong>${a.action_type}</strong> (${a.target_entity}:${a.target_id})</div>`).join('')}</div>
            </div>
          </div>
        `;
      } catch (e) {
        root.innerHTML = `<p class="text-red-700 font-semibold">Unable to connect to /api/admin/overview (${e.message}). Start FastAPI with: uvicorn backend.app:app</p>`;
      }
    }
    document.getElementById('refreshBtn').addEventListener('click', load);
    load();
  </script>
</body>
</html>
