<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AUT SpaceHub — Administrator Panel</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>
<body class="bg-neutral-100 text-neutral-900 min-h-screen p-3 sm:p-6 font-sans">
  <div class="max-w-4xl mx-auto space-y-4">
    <header class="bg-[#22201F] text-white rounded-2xl p-4 sm:p-6 space-y-3">
      <div class="flex items-start justify-between gap-3">
        <div>
          <div class="text-[10px] uppercase tracking-wider text-amber-300 font-bold">AUT SpaceHub &middot; Administration</div>
          <h1 class="text-xl sm:text-2xl font-extrabold mt-0.5">Admin Dashboard</h1>
          <p class="text-xs text-neutral-300 mt-0.5">Live bookings, student check-ins, club approvals &amp; campus rooms.</p>
        </div>
        <a href="/" class="shrink-0 px-3 py-1.5 rounded-xl bg-white/15 hover:bg-white/25 text-white text-xs font-bold">← SpaceHub</a>
      </div>
      <div class="flex items-center gap-2">
        <button id="refreshBtn" class="px-4 py-2 rounded-xl bg-[#80003C] hover:bg-[#61002D] text-xs font-bold">↻ Refresh Data</button>
        <span id="statusNote" class="text-[11px] text-neutral-300"></span>
      </div>
    </header>

    <div id="adminRoot" class="bg-white rounded-2xl border border-neutral-200 p-5 text-sm text-neutral-600">
      Loading administrator data...
    </div>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) { tg.ready(); tg.expand(); }

    function esc(v) {
      return String(v == null ? '' : v)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function authHeaders() {
      const h = { 'Content-Type': 'application/json' };
      if (tg && tg.initData) {
        h['X-Telegram-Init-Data'] = tg.initData;
      } else {
        let uid = '';
        try { uid = localStorage.getItem('spacehub_browser_uid') || ''; } catch (e) {}
        if (uid) h['X-Demo-Telegram-Id'] = uid;
      }
      return h;
    }

    async function api(path, opts = {}) {
      const res = await fetch(path, { ...opts, headers: { ...authHeaders(), ...(opts.headers || {}) } });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || ('HTTP ' + res.status));
      return data;
    }

    async function cancelRes(id) {
      if (!confirm('Cancel this student reservation?')) return;
      try {
        await api(`/api/reservations/${id}/cancel`, { method: 'POST' });
        await load();
      } catch (e) { alert(e.message); }
    }

    async function reviewEvent(id, decision) {
      try {
        await api(`/api/admin/events/${id}/review`, {
          method: 'POST',
          body: JSON.stringify({ decision, note: decision === 'approve' ? 'Approved by Admin' : 'Declined by Admin' })
        });
        await load();
      } catch (e) { alert(e.message); }
    }

    async function load() {
      const root = document.getElementById('adminRoot');
      const note = document.getElementById('statusNote');
      note.textContent = 'Refreshing...';
      try {
        const data = await api('/api/admin/overview');
        const userMap = {};
        (data.users || []).forEach(u => { userMap[u.id] = u; });

        const reservations = data.reservations || [];
        const activeRes = reservations.filter(r => r.status === 'confirmed');
        const pendingEv = (data.club_events || []).filter(e => e.status === 'pending_approval');

        note.textContent = 'Updated ' + new Date().toLocaleTimeString();
        root.className = 'space-y-4';
        root.innerHTML = `
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
            <div class="bg-white rounded-2xl border border-neutral-200 p-3.5">
              <div class="text-[10px] font-bold uppercase text-neutral-500">Active Bookings</div>
              <div class="text-2xl font-extrabold text-[#80003C] mt-0.5">${activeRes.length}</div>
            </div>
            <div class="bg-white rounded-2xl border border-neutral-200 p-3.5">
              <div class="text-[10px] font-bold uppercase text-neutral-500">Pending Clubs</div>
              <div class="text-2xl font-extrabold text-amber-700 mt-0.5">${pendingEv.length}</div>
            </div>
            <div class="bg-white rounded-2xl border border-neutral-200 p-3.5">
              <div class="text-[10px] font-bold uppercase text-neutral-500">Total Users</div>
              <div class="text-2xl font-extrabold text-neutral-900 mt-0.5">${(data.users || []).length}</div>
            </div>
            <div class="bg-white rounded-2xl border border-neutral-200 p-3.5">
              <div class="text-[10px] font-bold uppercase text-neutral-500">Rooms</div>
              <div class="text-2xl font-extrabold text-neutral-900 mt-0.5">${(data.rooms || []).length}</div>
            </div>
          </div>

          <section class="bg-white rounded-2xl border border-neutral-200 p-4 space-y-3">
            <div class="flex items-center justify-between">
              <h2 class="font-extrabold text-base text-neutral-900">Room Reservations — Who Booked What (${reservations.length})</h2>
            </div>
            ${reservations.length === 0 ? `
              <p class="text-xs text-neutral-500 py-4 text-center">No room reservations have been made yet.</p>
            ` : `
              <div class="space-y-2.5">
                ${reservations.map(r => {
                  const u = userMap[r.user_id] || {};
                  const uname = u.username ? ` (@${esc(u.username)})` : '';
                  const statusBadge = r.status === 'confirmed'
                    ? 'bg-emerald-100 text-emerald-800'
                    : r.status === 'pending_approval'
                      ? 'bg-amber-100 text-amber-900'
                      : 'bg-neutral-200 text-neutral-600';
                  return `
                    <div class="p-3 rounded-xl border border-neutral-200 text-xs space-y-1.5">
                      <div class="flex flex-wrap items-center justify-between gap-1.5">
                        <div class="font-extrabold text-neutral-900">${esc(r.full_name || 'Student')}<span class="font-normal text-neutral-500">${uname}</span></div>
                        <div class="flex items-center gap-1.5">
                          ${r.checked_in_at ? '<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-600 text-white">✓ Checked In</span>' : ''}
                          <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${statusBadge}">${esc(r.status.replace('_', ' '))}</span>
                        </div>
                      </div>
                      <div class="text-neutral-700"><strong>Room ${esc(r.room_id)}</strong> &middot; ${esc(r.reservation_date)} &middot; ${esc(r.start_time)}–${esc(r.end_time)}</div>
                      <div class="flex flex-wrap items-center justify-between gap-2 text-[11px] text-neutral-500">
                        <span>${esc(r.purpose || 'Study Session')} &middot; <span class="font-mono font-bold text-neutral-700">${esc(r.booking_code)}</span></span>
                        ${r.status === 'confirmed' ? `<button type="button" onclick="cancelRes(${r.id})" class="px-2.5 py-1 rounded-lg border border-red-300 bg-red-50 text-red-700 font-bold text-[10px]">Cancel</button>` : ''}
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </section>

          <section class="bg-white rounded-2xl border border-neutral-200 p-4 space-y-3">
            <h2 class="font-extrabold text-base text-neutral-900">Club Events (${(data.club_events || []).length})</h2>
            ${(data.club_events || []).length === 0 ? `<p class="text-xs text-neutral-500">No club event requests yet.</p>` : `
              <div class="space-y-2.5">
                ${(data.club_events || []).map(e => `
                  <div class="p-3 rounded-xl border border-neutral-200 text-xs space-y-1.5">
                    <div class="flex items-center justify-between gap-2">
                      <div class="font-extrabold text-neutral-900">${esc(e.title)}</div>
                      <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-900">${esc(e.status.replace('_', ' '))}</span>
                    </div>
                    <div class="text-neutral-600">${esc(e.club_name)} &middot; Room ${esc(e.room_id)} &middot; ${esc(e.event_date)} ${esc(e.start_time)}–${esc(e.end_time)}</div>
                    ${e.status === 'pending_approval' ? `
                      <div class="flex gap-2 pt-1">
                        <button type="button" onclick="reviewEvent(${e.id}, 'approve')" class="flex-1 py-1.5 rounded-lg bg-emerald-600 text-white font-bold">Approve</button>
                        <button type="button" onclick="reviewEvent(${e.id}, 'reject')" class="flex-1 py-1.5 rounded-lg border border-red-300 bg-red-50 text-red-700 font-bold">Reject</button>
                      </div>
                    ` : ''}
                  </div>
                `).join('')}
              </div>
            `}
          </section>

          <div class="grid md:grid-cols-2 gap-4">
            <section class="bg-white rounded-2xl border border-neutral-200 p-4 space-y-2.5">
              <h2 class="font-extrabold text-sm text-neutral-900">Registered Users (${(data.users || []).length})</h2>
              <div class="space-y-1.5 text-xs">
                ${(data.users || []).map(u => `
                  <div class="p-2 rounded-lg border border-neutral-100 flex justify-between">
                    <span class="font-semibold">${esc(u.full_name)}${u.username ? ` <span class="text-neutral-400">@${esc(u.username)}</span>` : ''}</span>
                    <span class="font-mono text-[10px] text-neutral-500">ID: ${esc(u.telegram_id)}</span>
                  </div>
                `).join('')}
              </div>
            </section>

            <section class="bg-white rounded-2xl border border-neutral-200 p-4 space-y-2.5">
              <h2 class="font-extrabold text-sm text-neutral-900">Rooms &amp; Access (${(data.rooms || []).length})</h2>
              <div class="space-y-1.5 text-xs">
                ${(data.rooms || []).map(r => `
                  <div class="p-2 rounded-lg border border-neutral-100 flex justify-between">
                    <strong>${esc(r.name)} (${r.capacity} seats)</strong>
                    <span class="font-mono text-[11px] text-[#80003C]">${esc(r.access_mode)}</span>
                  </div>
                `).join('')}
              </div>
            </section>
          </div>
        `;
      } catch (e) {
        note.textContent = '';
        root.className = 'bg-white rounded-2xl border border-red-200 p-5 text-xs text-red-700 font-semibold space-y-2';
        root.innerHTML = `<p>Could not load Admin Dashboard (${esc(e.message)}).</p><p class="text-neutral-600 font-normal">Make sure you opened this from your Admin Telegram account inside @aut_spacehub_bot.</p>`;
      }
    }

    document.getElementById('refreshBtn').addEventListener('click', load);
    load();
  </script>
</body>
</html>
