services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      - SPACEHUB_DB_PATH=/app/data/spacehub.db

  bot:
    build: .
    command: ["python3", "bot/bot.py"]
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      - SPACEHUB_DB_PATH=/app/data/spacehub.db
    depends_on:
      - api
